<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KuroHana — Where Shadows Bloom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="intro fade-in" id="intro">
    <h1>KuroHana</h1>
    <p>Where Shadows Bloom.</p>
    <button id="enter">Enter the Void</button>
  </div>

  <div class="chat fade-in" id="chatBox">
    <h2>KuroHana Chat</h2>
    <textarea id="userInput" placeholder="Ask something from the KuroHana dev archives..."></textarea>
    <button id="send">Send</button>
    <div id="response">Awaiting your query 🌸</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
